[package]
name = "tasks"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
fastrand = "2"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
